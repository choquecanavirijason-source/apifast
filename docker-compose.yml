
services:
  # MySQL opcional (desactivado: el backend usa SQLite, ver servicio backend).
  # database:
  #   image: mysql:8.0
  #   container_name: "elashes-database"
  #   environment:
  #     MYSQL_DATABASE: "elashes"
  #     MYSQL_USER: "admin"
  #     MYSQL_PASSWORD: "password"
  #     MYSQL_ROOT_PASSWORD: "password"
  #   ports:
  #     - "3307:3306"
  #   volumes:
  #     - './mysql:/var/lib/mysql'
  #   networks:
  #     - app-network

  # --- Postgres — migración desde SQLite completada, backend ya le apunta. ---
  database:
    image: postgres:16
    container_name: "elashes-postgres"
    restart: always
    environment:
      POSTGRES_DB: elashes
      POSTGRES_USER: elashes_user
      POSTGRES_PASSWORD: cambiar_esto
    volumes:
      - ./elashesbackend/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  # --- Backend (Python) — Postgres (migrado desde SQLite, ver elashes.db.backup-*) ---
  backend:
    build: ./elashesbackend
    image: proyect-elashes-backend:latest
    container_name: "elashes-backend"
    restart: always
    volumes:
      - ./elashesbackend:/app
      # Push FCM: carpeta de secretos FUERA del repo, solo lectura. Por defecto
      # ../elashes-secrets (al lado del repo); en el servidor se puede cambiar
      # con ELASHES_SECRETS_DIR. Dentro va fcm-service-account.json (la cuenta
      # de servicio de Firebase). Si no existe, el push queda desactivado y
      # todo lo demás funciona igual.
      - ${ELASHES_SECRETS_DIR:-../elashes-secrets}:/run/secrets/elashes:ro
    ports:
      - "8000:8000"
    # Secretos (INTERNAL_API_KEY, CLIENT_NOTICES_ENABLED...): no se suben a git.
    # Crear con: cp elashesbackend/.env.example elashesbackend/.env
    env_file:
      - ./elashesbackend/.env
    environment:
      - DATABASE_URL=postgresql://elashes_user:cambiar_esto@database:5432/elashes
      - SECRET_KEY=tu_clave_secreta_aqui
      # microservicioMarketplace corre en el host (puerto 8001), fuera de este compose.
      # Desde dentro del contenedor "localhost" se refiere al propio contenedor, no al host.
      - MARKETPLACE_BACKEND_URL=http://host.docker.internal:8001
      # Ruta DENTRO del contenedor (ver el volumen de secretos de arriba).
      - FCM_CREDENTIALS_FILE=/run/secrets/elashes/fcm-service-account.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - database
    networks:
      - app-network

  # --- Tests (pytest) — no arranca con `up`; usar: docker compose run --rm backend-test ---
  backend-test:
    profiles: ["test"]
    build:
      context: ./elashesbackend
      args:
        INSTALL_DEV: "true"
    image: proyect-elashes-backend:test
    volumes:
      - ./elashesbackend:/app
    command: ["python", "-m", "pytest", "-q"]

  # --- Frontend (React) ---
  frontend:
    build: ./adminElashes
    container_name: "elashes-frontend"
    ports:
      - "3000:80"
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
