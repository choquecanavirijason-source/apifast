server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Debe ser >= al límite más grande que acepte la app (reels de video: 80 MB).
    client_max_body_size 100m;

    # DNS interno de Docker. Con el host en una variable, nginx resuelve
    # "backend" en cada petición y no al arrancar: si el backend aún no
    # existe, el front levanta igual en vez de caerse.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    # La imagen se compila con VITE_API_URL=/api (ver Dockerfile): se quita
    # el prefijo /api y se manda al backend, igual que en el nginx de GCP.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Subir un video de reel lo transcodifica antes de responder.
        proxy_read_timeout 480;
        proxy_connect_timeout 60;
    }

    # WebSocket (tickets en tiempo real).
    location /ws/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # SPA (React Router): cualquier ruta que no sea un archivo real se
    # resuelve con index.html, para que el router del cliente la maneje.
    # Sin esto, entrar directo por URL (o recargar) a una ruta como
    # /marketplace da 404 en vez de cargar la app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
