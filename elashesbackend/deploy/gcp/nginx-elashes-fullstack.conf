server {
    listen 80;
    server_name _;

    root /opt/elashes/apifast/server/public/app;
    index index.html;

    client_max_body_size 20m;

    # ── elashesbackend REST API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # ── WebSocket (tickets en tiempo real) ───────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ── backend_marketplace API (usada por la app Flutter, no por el admin) ───
    # OJO: no usar prefijo "/marketplace/" aquí — el admin web ya tiene rutas
    # de React Router en /marketplace/* (products, categories, ads, etc.) y
    # esta location las interceptaría antes del fallback de SPA, rompiendo
    # el recargo de página (F5) con un 404 del backend.
    location /mp-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 60;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
