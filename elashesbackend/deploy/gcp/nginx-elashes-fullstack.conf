server {
    listen 80;
    server_name _;

    root /opt/elashes/apifast/server/public/app;
    index index.html;

    # Debe ser >= al límite más grande que acepte la app (reels de video: 80 MB).
    client_max_body_size 100m;

    # ── elashesbackend REST API ───────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 480s (no 300s): subir un video de reel/producto ahora lo
        # transcodifica en el servidor antes de responder — en el VPS de
        # producción eso puede pasar los 5 minutos.
        proxy_read_timeout 480;
        proxy_connect_timeout 60;
    }

    # ── WebSocket (tickets en tiempo real) ───────────────────────────────────
    location /ws/ {
        proxy_pass http://127.0.0.1:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # ── media del marketplace (imágenes/videos) servida directo por nginx ─────
    # Starlette 0.27 (el que usa marketplaceapi) no soporta peticiones Range en
    # StaticFiles — siempre manda el archivo completo, lo que rompe el "seek"
    # en el reproductor de video del tutorial de producto (duración/posición
    # se quedan en 00:00). nginx sí soporta Range nativamente, así que para
    # esta ruta puntual se sirve directo del disco en vez de proxyear a
    # FastAPI. Debe ir ANTES de /mp-api/ (nginx igual prioriza el prefijo más
    # específico, pero se deja explícito por claridad).
    location /mp-api/media/ {
        alias /opt/elashes/marketplaceapi/media/;
        add_header Accept-Ranges bytes;
    }

    # ── backend_marketplace API (usada por la app Flutter, no por el admin) ───
    # OJO: no usar prefijo "/marketplace/" aquí — el admin web ya tiene rutas
    # de React Router en /marketplace/* (products, categories, ads, etc.) y
    # esta location las interceptaría antes del fallback de SPA, rompiendo
    # el recargo de página (F5) con un 404 del backend.
    location /mp-api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 480;
        proxy_connect_timeout 60;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
